<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="168" viewBox="0 0 1280 168" role="img" aria-label="97.6% precursor recall, 90.9% precursor F1, about 1.9 ms per report on CPU, 361 backend tests passing, 0 network calls at runtime" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- tile template: 240 wide, 20 gap -->
    <g transform="translate(0 0)">
      <rect width="240" height="168" rx="14" fill="#161616" stroke="#393939"/>
      <rect x="24" y="24" width="36" height="4" rx="2" fill="#d95926"/>
      <text x="24" y="90" fill="#f4f4f4" font-size="48" font-weight="700" letter-spacing="-1">97.6%</text>
      <text x="24" y="122" fill="#c6c6c6" font-size="16" font-weight="600">Precursor recall</text>
      <text x="24" y="144" fill="#8d8d8d" font-size="13">160 of 164 caught, held-out set</text>
    </g>
    <g transform="translate(260 0)">
      <rect width="240" height="168" rx="14" fill="#161616" stroke="#393939"/>
      <rect x="24" y="24" width="36" height="4" rx="2" fill="#4589ff"/>
      <text x="24" y="90" fill="#f4f4f4" font-size="48" font-weight="700" letter-spacing="-1">90.9%</text>
      <text x="24" y="122" fill="#c6c6c6" font-size="16" font-weight="600">Precursor F1</text>
      <text x="24" y="144" fill="#8d8d8d" font-size="13">85.1% precision</text>
    </g>
    <g transform="translate(520 0)">
      <rect width="240" height="168" rx="14" fill="#161616" stroke="#393939"/>
      <rect x="24" y="24" width="36" height="4" rx="2" fill="#199e70"/>
      <text x="24" y="90" fill="#f4f4f4" font-size="48" font-weight="700" letter-spacing="-1">1.9<tspan font-size="26" fill="#c6c6c6" dx="6">ms</tspan></text>
      <text x="24" y="122" fill="#c6c6c6" font-size="16" font-weight="600">Per report</text>
      <text x="24" y="144" fill="#8d8d8d" font-size="13">plain CPU, no GPU</text>
    </g>
    <g transform="translate(780 0)">
      <rect width="240" height="168" rx="14" fill="#161616" stroke="#393939"/>
      <rect x="24" y="24" width="36" height="4" rx="2" fill="#fab219"/>
      <text x="24" y="90" fill="#f4f4f4" font-size="48" font-weight="700" letter-spacing="-1">17</text>
      <text x="24" y="122" fill="#c6c6c6" font-size="16" font-weight="600">Named rules decide</text>
      <text x="24" y="144" fill="#8d8d8d" font-size="13">the model only extracts facts</text>
    </g>
    <g transform="translate(1040 0)">
      <rect width="240" height="168" rx="14" fill="#161616" stroke="#393939"/>
      <rect x="24" y="24" width="36" height="4" rx="2" fill="#0ca30c"/>
      <text x="24" y="90" fill="#f4f4f4" font-size="48" font-weight="700" letter-spacing="-1">0</text>
      <text x="24" y="122" fill="#c6c6c6" font-size="16" font-weight="600">Network calls</text>
      <text x="24" y="144" fill="#8d8d8d" font-size="13">air-gapped by design</text>
