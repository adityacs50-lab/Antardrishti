<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="prahari — Most safety systems rank what happened. prahari ranks what almost did." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#0f62fe" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0f62fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4589ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4589ff" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="#161616"/>
    <rect width="1280" height="440" fill="url(#grid)" opacity="0.55"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="4" fill="#0f62fe"/>

    <!-- ===== Left: wordmark ===== -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="92" fill="#a8a8a8" font-size="15" font-weight="600" letter-spacing="3.2">SMART INDIA HACKATHON 2026  ·  SIH26165  ·  OIL INDIA LIMITED</text>

      <text x="68" y="196" fill="#f4f4f4" font-size="104" font-weight="700" letter-spacing="-3">prahari</text>
      <text x="452" y="194" fill="#4589ff" font-size="50" font-weight="600" font-family="'Noto Sans Devanagari', 'Nirmala UI', 'Kohinoor Devanagari', Mangal, sans-serif">प्रहरी</text>

      <text x="72" y="256" fill="#c6c6c6" font-size="27" font-weight="400">Most safety systems rank what happened.</text>
      <text x="72" y="296" fill="#f4f4f4" font-size="27" font-weight="600">prahari ranks what almost did.</text>
      <rect x="72" y="306" width="378" height="3" fill="#d95926"/>

      <!-- chips -->
      <g font-size="14" font-weight="600">
        <rect x="72" y="342" width="148" height="34" rx="17" fill="#0ca30c" fill-opacity="0.14" stroke="#0ca30c" stroke-opacity="0.6"/>
        <circle cx="92" cy="359" r="4.5" fill="#0ca30c"/>
        <text x="104" y="364" fill="#c6f0c6">100% offline</text>

        <rect x="232" y="342" width="202" height="34" rx="17" fill="#4589ff" fill-opacity="0.14" stroke="#4589ff" stroke-opacity="0.6"/>
        <circle cx="252" cy="359" r="4.5" fill="#4589ff"/>
        <text x="264" y="364" fill="#d0e2ff">Every verdict rule-traced</text>

        <rect x="446" y="342" width="168" height="34" rx="17" fill="#d95926" fill-opacity="0.14" stroke="#d95926" stroke-opacity="0.6"/>
        <circle cx="466" cy="359" r="4.5" fill="#d95926"/>
        <text x="478" y="364" fill="#ffd8c7">EN · हिंदी · অসমীয়া</text>
      </g>
    </g>

    <!-- ===== Right: sentinel radar ===== -->
    <g transform="translate(1000 222)">
      <g fill="none" stroke="#393939" stroke-width="1.2">
        <circle r="170"/>
        <circle r="124"/>
        <circle r="78"/>
        <circle r="32"/>
        <path d="M-180 0H180M0 -180V180" stroke-dasharray="3 6"/>
      </g>

      <!-- rotating sweep -->
      <g>
        <path d="M0 0 L170 0 A170 170 0 0 0 120.2 -120.2 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="170" y2="0" stroke="#4589ff" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </g>

      <!-- ordinary reports -->
      <g fill="#6f6f6f">
        <circle cx="-96" cy="-52" r="4"/>
        <circle cx="-40" cy="104" r="4"/>
        <circle cx="58" cy="128" r="4"/>
        <circle cx="-132" cy="64" r="4"/>
        <circle cx="104" cy="40" r="4"/>
        <circle cx="-22" cy="-138" r="4"/>
        <circle cx="140" cy="-24" r="4"/>
        <circle cx="-66" cy="12" r="4"/>
      </g>
      <!-- low-severity injury (visible but low potential) -->
      <circle cx="-110" cy="-104" r="5" fill="#fab219"/>

      <!-- the precursor -->
      <g transform="translate(66 -88)">
        <circle r="7" fill="#d95926"/>
        <circle r="7" fill="none" stroke="#d95926" stroke-width="2">
          <animate attributeName="r" values="7;26;7" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
        <line x1="76" y1="-96" x2="128" y2="-150" stroke="#d95926" stroke-width="1.2"/>
        <text x="132" y="-154" fill="#ec835a">POTENTIAL SIF</text>
        <text x="132" y="-139" fill="#a8a8a8" font-weight="400" letter-spacing="0">no injury · guard missing</text>
      </g>
      <circle r="5" fill="#f4f4f4"/>
    </g>
  </g>
</svg>
